<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <div class="input-section">
          <div id="input-space"></div>
        </div>
        <div class="bottom-button">
          <div class="basic-math">
            <button>+</button>
            <button>-</button>
            <button>x</button>
            <button>÷</button>
          </div>
          <div class="math-section">
            <div class="number-math">
              <button>1</button>
              <button>2</button>
              <button>3</button>
              <button>4</button>
              <button>5</button>
              <button>6</button>
              <button>7</button>
              <button>8</button>
              <button>9</button>
              <div>
                <button>0</button>
                <button class="clear-button">Clear</button>
              </div>
            </div>
            <div class="right-section">
              <button class="delete-button">Delete</button>
              <button class="equal-button">=</button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="calculator.js"></script>
  </body>
</html>
