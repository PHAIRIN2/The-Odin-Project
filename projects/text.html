<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมเป่ายิ้งฉุบ - The Odin Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        button {
            font-size: 18px;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }
        #results {
            font-size: 20px;
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
        #score {
            font-size: 24px;
            margin-top: 15px;
            color: #0066cc;
        }
        .final-winner {
            color: #ff3300 !important;
            font-size: 28px !important;
        }
    </style>
</head>
<body>

    <h1>เกมเป่ายิ้งฉุบ (Rock Paper Scissors)</h1>
    <p>เลือกอาวุธของคุณ ใครได้ 5 คะแนนก่อนเป็นฝ่ายชนะ!</p>

    <!-- 1. ปุ่มกดสำหรับผู้เล่น -->
    <div class="buttons">
        <button id="rock">✊ Rock</button>
        <button id="paper">✋ Paper</button>
        <button id="scissors">✌️ Scissors</button>
    </div>

    <!-- 2. ส่วนแสดงผลลัพธ์ผ่าน DOM -->
    <div id="results">เริ่มเกมโดยการกดปุ่มด้านบนได้เลย!</div>
    <div id="score">Player: 0 | Computer: 0</div>

    <script>
        // --- ส่วนของ JAVASCRIPT ---

        // ตั้งค่าตัวแปรเก็บคะแนนเริ่มต้น
        let playerScore = 0;
        let computerScore = 0;

        // เลือกองค์ประกอบ (Elements) จาก HTML มาใช้งาน
        const rockBtn = document.querySelector('#rock');
        const paperBtn = document.querySelector('#paper');
        const scissorsBtn = document.querySelector('#scissors');
        const resultsDiv = document.querySelector('#results');
        const scoreDiv = document.querySelector('#score');

        // สุ่มตัวเลือกของคอมพิวเตอร์
        function getComputerChoice() {
            const choices = ['rock', 'paper', 'scissors'];
            const randomIndex = Math.floor(Math.random() * choices.length);
            return choices[randomIndex];
        }

        // ฟังก์ชันสำหรับเล่นแต่ละรอบ
        function playRound(playerSelection) {
            // ถ้ามีใครได้ 5 คะแนนแล้ว จะล็อกไม่ให้เล่นต่อ
            if (playerScore === 5 || computerScore === 5) return;

            const computerSelection = getComputerChoice();
            let roundResult = "";

            // ลอจิกการตัดสินผลแพ้-ชนะ
            if (playerSelection === computerSelection) {
                roundResult = `เสมอจ้า! ทั้งคู่เลือกตรงกัน: ${playerSelection}`;
            } else if (
                (playerSelection === 'rock' && computerSelection === 'scissors') ||
                (playerSelection === 'paper' && computerSelection === 'rock') ||
                (playerSelection === 'scissors' && computerSelection === 'paper')
            ) {
                playerScore++; // เพิ่มคะแนนผู้เล่น
                roundResult = `คุณชนะรอบนี้! ${playerSelection} ชนะ ${computerSelection}`;
            } else {
                computerScore++; // เพิ่มคะแนนคอมพิวเตอร์
                roundResult = `คุณแพ้รอบนี้! ${computerSelection} ชนะ ${playerSelection}`;
            }

            // แสดงผลลัพธ์รอบปัจจุบันลงในหน้าเว็บ (DOM)
            resultsDiv.textContent = roundResult;
            scoreDiv.textContent = `Player: ${playerScore} | Computer: ${computerScore}`;

            // ตรวจสอบหาผู้ชนะคนแรกที่ได้ 5 คะแนน
            checkWinner();
        }

        // ฟังก์ชันตรวจสอบและประกาศผู้ชนะ
        function checkWinner() {
            if (playerScore === 5) {
                resultsDiv.textContent = "🎉 ยินดีด้วย! คุณเป็นผู้ชนะคนแรกที่ได้ 5 คะแนน 🎉";
                resultsDiv.classList.add('final-winner');
            } else if (computerScore === 5) {
                resultsDiv.textContent = "🤖 เกมจบแล้ว! คอมพิวเตอร์ได้ครบ 5 คะแนนก่อน 🤖";
                resultsDiv.classList.add('final-winner');
            }
        }

        // ดักจับเหตุการณ์การคลิกปุ่ม (Event Listeners)
        rockBtn.addEventListener('click', () => playRound('rock'));
        paperBtn.addEventListener('click', () => playRound('paper'));
        scissorsBtn.addEventListener('click', () => playRound('scissors'));

    </script>
</body>
</html>
